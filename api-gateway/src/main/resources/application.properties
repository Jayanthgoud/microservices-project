spring.application.name=api-gateway
server.port=8083
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
# ===============================
# Gateway Routes
# ===============================

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://products-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/orders/**

# ===============================
# JWT
# ===============================

#spring.security.oauth2.resourceserver.jwt.issuer-uri=YOUR_ISSUER_URI

# ===============================
# Actuator
# ===============================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

